name: Update market data

on:
  schedule:
    - cron: "37 22 * * 1-5"   # weekdays, after the US close (22:37 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/update_markets.py
      - .github/workflows/update-markets.yml

permissions:
  contents: write

concurrency:
  group: update-markets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas lxml requests
      - name: Fetch indices, constituents, prices and analyst targets
        run: python tools/update_markets.py
      - name: Commit the new data
        run: |
          git config user.name "puccetti-capital-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/markets
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Market data $(date -u +%F)"
          git pull --rebase origin main
          git push
